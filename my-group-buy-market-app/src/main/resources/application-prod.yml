server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:mysql}:${SPRING_DATASOURCE_PORT}/group_buy_market?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD}
    listener:
      simple:
        prefetch: 1
    template:
      delivery-mode: persistent
    config:
      producer:
        exchange: ${SPRING_RABBITMQ_EXCHANGE:group_buy_market_exchange}
        topic_team_success:
          routing_key: ${SPRING_RABBITMQ_TEAM_SUCCESS_ROUTING_KEY:topic.team_success}
          queue: ${SPRING_RABBITMQ_TEAM_SUCCESS_QUEUE:group_buy_market_queue_2_topic_team_success}
  type: com.zaxxer.hikari.HikariDataSource

  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1


# MyBatis 配置【如需使用记得打开】
mybatis:
  mapper-locations: classpath:/com/lkh/infrastructure/dao/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
#  config-location:  classpath:/mybatis/config/mybatis-config.xml
# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

redis:
  sdk:
    config:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

